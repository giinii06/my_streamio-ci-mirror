[workspace]
members = [
  "crates/domain",
  "crates/discovery",
  "crates/scheduler",
  "crates/torrent-adapter",
  "crates/verified-store",
  "apps/daemon",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
librqbit = "=9.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "2"
