workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - smoke
  - test

runner_smoke:
  stage: smoke
  image: alpine:3.21
  script:
    - echo "Checking GitLab runner availability for my_streamio"
    - test -n "$CI_RUNNER_ID"
    - test -n "$CI_COMMIT_SHA"
    - test -f README.md
    - sh -n tests/fixtures/generate.sh
    - sh -n tests/integration/smoke.sh
    - sh -n tests/integration/hls.sh
    - bash -n scripts/benchmark_m5.sh
    - test -f docs/RELEASE_CHECKLIST.md
    - test -f docs/IMPLEMENTATION_STATUS.md
    - printf 'Runner ID %s executed commit %s\n' "$CI_RUNNER_ID" "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

rust_verify:
  stage: test
  image: rust:1.100.0-bookworm
  variables:
    CARGO_TERM_COLOR: never
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_INCREMENTAL: "0"
  cache:
    key: "my-streamio-rust100-arm64-v1"
    paths:
      - .cargo/registry/
      - target/
    policy: pull-push
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Cargo.lock
  script:
    - rustc --version
    # Temporary diagnostic formatting in job workspace; source formatting is a follow-up commit.
    - cargo fmt --all
    - git diff --check
    - cargo test --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo build --workspace
    - sh tests/integration/smoke.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
