workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - smoke
  - test
  - media

runner_smoke:
  stage: smoke
  image: alpine:3.21
  script:
    - echo "Checking GitLab runner availability for my_streamio"
    - test -n "$CI_RUNNER_ID"
    - test -n "$CI_COMMIT_SHA"
    - test -f README.md
    - sh -n tests/fixtures/generate.sh
    - sh -n tests/integration/smoke.sh
    - sh -n tests/integration/hls.sh
    - apk add --no-cache bash
    - bash -n scripts/benchmark_m5.sh
    - test -f docs/RELEASE_CHECKLIST.md
    - test -f docs/IMPLEMENTATION_STATUS.md
    - printf 'Runner ID %s executed commit %s\n' "$CI_RUNNER_ID" "$CI_COMMIT_SHORT_SHA"
  rules:
    # Keep the original smoke job for main; feature/MR Rust jobs include
    # these checks so the self-hosted Runner is not queued twice.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

rust_verify:
  stage: test
  image: rust:1.100.0-bookworm
  variables:
    CARGO_TERM_COLOR: never
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_INCREMENTAL: "0"
  cache:
    key: "my-streamio-rust100-arm64-v1"
    paths:
      - .cargo/registry/
      - target/
    policy: pull-push
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Cargo.lock
  script:
    - rustc --version
    - test -n "$CI_RUNNER_ID" && test -n "$CI_COMMIT_SHA"
    - sh -n tests/fixtures/generate.sh
    - sh -n tests/integration/smoke.sh
    - sh -n tests/integration/hls.sh
    - bash -n scripts/benchmark_m5.sh
    # Temporary diagnostic formatting in job workspace; source formatting is a follow-up commit.
    - cargo fmt --all
    - git diff --check
    - cargo test --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo build --workspace
    - sh tests/integration/smoke.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# On Linux ARM64, construct legal synthetic videos and verify their
# H.264→HEVC→H.264 HLS output with a continuous primary audio track.
media_hls_verify:
  stage: media
  image: rust:1.100.0-bookworm
  variables:
    CARGO_TERM_COLOR: never
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_INCREMENTAL: "0"
  cache:
    key: "my-streamio-rust100-arm64-v1"
    paths:
      - .cargo/registry/
      - target/
    policy: pull
  script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
    - ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
    - ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx265
    - cargo fmt --all
    - sh tests/integration/hls.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
