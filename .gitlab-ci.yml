stages:
  - smoke

runner_smoke:
  stage: smoke
  image: alpine:3.21
  script:
    - echo "Checking GitLab runner availability for my_streamio"
    - test -n "$CI_RUNNER_ID"
    - test -n "$CI_COMMIT_SHA"
    - test -f README.md
    - printf 'Runner ID %s executed commit %s\n' "$CI_RUNNER_ID" "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
